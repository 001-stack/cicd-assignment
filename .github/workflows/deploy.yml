name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        # Runs the test script if it exists in package.json
        run: npm run test --if-present

      - name: Build React App
        run: npm run build

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET: ${{ secrets.EC2_TARGET }}
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add EC2 host to known_hosts to prevent SSH from asking for confirmation
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Use rsync to deploy the dist folder to the target directory on EC2
          rsync -avz --delete dist/ $EC2_USER@$EC2_HOST:$EC2_TARGET
